<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPERSTAR TREASURE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
</head>

<body>
    <div id="game-container">
        <!-- 背景视频与音频 -->
        <video id="bg-video" loop muted playsinline></video>
        <audio id="bg-music"></audio>

        <!-- 游戏画布 -->
        <canvas id="game-canvas"></canvas>

        <!-- 游戏内 UI 顶部区域 -->
        <div id="game-ui" class="game-ui">
            <button id="pause-btn" class="ui-pause-btn">⏸ PAUSE</button>
            <div class="score-board">
                <span class="score-label">SCORE</span>
                <span id="score-value">0</span>
            </div>
        </div>

        <!-- 手机端屏幕底部虚拟按键区 -->
        <div id="touch-keys" class="touch-keys-container"></div>

        <!-- 暂停弹窗 -->
        <div id="pause-overlay" class="overlay hidden">
            <div class="pause-card">
                <h2>PAUSED</h2>
                <div class="pause-actions">
                    <button id="resume-btn" class="btn primary">RESUME</button>
                    <button id="restart-in-game-btn" class="btn secondary">RESTART</button>
                    <button id="home-btn" class="btn danger">HOME</button>
                </div>
            </div>
        </div>

        <!-- 开始/单排选歌界面 -->
        <div id="start-screen" class="overlay">
            <h1 class="logo">SUPERSTAR<br><span>TREASURE</span></h1>

            <div class="song-selection-container">
                <div id="song-list" class="song-list"></div>
                <div id="song-detail" class="song-detail">
                    <div class="no-song-placeholder">please select a song</div>
                </div>
            </div>

            <button id="start-btn" class="btn primary-lg" disabled>please select a song</button>
        </div>

        <!-- 结算界面 -->
        <div id="end-screen" class="overlay hidden">
            <div class="result-card">
                <span class="subtitle">RESULT</span>
                <h1 id="grade-display" class="rank">S</h1>
                <div class="total-score-box">
                    <span class="label">TOTAL SCORE</span>
                    <h2 id="final-score-value" class="total-score">0</h2>
                </div>

                <div class="high-score-box">
                    <span>BEST SCORE: <strong id="best-score">0</strong></span>
                </div>

                <!-- 四项判定数据 -->
                <div class="stats-grid">
                    <div class="stat-item perfect">
                        <span id="stat-perfect" class="num">0</span>
                        <span class="txt">PERFECT</span>
                    </div>
                    <div class="stat-item great">
                        <span id="stat-great" class="num">0</span>
                        <span class="txt">GREAT</span>
                    </div>
                    <div class="stat-item good">
                        <span id="stat-good" class="num">0</span>
                        <span class="txt">GOOD</span>
                    </div>
                    <div class="stat-item miss">
                        <span id="stat-miss" class="num">0</span>
                        <span class="txt">MISS</span>
                    </div>
                </div>

                <div class="sub-stats">
                    <div class="sub-item">
                        <span class="sub-label">MAX COMBO</span>
                        <span id="stat-maxcombo" class="sub-value">0</span>
                    </div>
                    <div class="sub-item">
                        <span class="sub-label">ACCURACY</span>
                        <span id="stat-accuracy" class="sub-value">0%</span>
                    </div>
                </div>

                <div class="result-actions">
                    <button id="retry-btn" class="btn primary">PLAY AGAIN</button>
                    <button id="result-home-btn" class="btn secondary">HOME</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
