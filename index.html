<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BABYMONSTER - RHYTHM BEAT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <!-- 视频背景 -->
        <video id="bg-video" loop muted playsinline></video>
        <audio id="bg-music" preload="auto"></audio>

        <!-- 游戏画布 -->
        <canvas id="game-canvas"></canvas>

        <!-- 首页选择界面 -->
        <div id="start-screen" class="screen">
            <div class="header-banner">
                <h1>BABYMONSTER</h1>
                <p>RHYTHM BEAT STAGE</p>
            </div>
            <div class="main-content-layout">
                <div class="song-list-container">
                    <h3>SELECT TRACK</h3>
                    <div id="song-list"></div>
                </div>
                <div class="song-detail-container" id="song-detail">
                    <!-- 动态渲染歌曲详情与难度选择 -->
                </div>
            </div>
            <div class="footer-action">
                <button id="start-btn" class="cyber-btn" disabled>
                    <span class="btn-text">▶ START GAME</span>
                </button>
            </div>
        </div>

        <!-- 游戏中的 UI -->
        <div id="game-ui" class="hidden">
            <div id="hud-top">
                <div id="score-board">SCORE: <span id="score-value">0</span></div>
                <button id="pause-btn" class="icon-btn">⏸</button>
            </div>
        </div>

        <!-- 暂停遮罩 -->
        <div id="pause-overlay" class="screen overlay hidden">
            <div class="menu-box">
                <h2>GAME PAUSED</h2>
                <div class="menu-buttons">
                    <button id="resume-btn" class="cyber-btn">RESUME</button>
                    <button id="restart-in-game-btn" class="cyber-btn">RETRY</button>
                    <button id="home-btn" class="cyber-btn secondary">QUIT</button>
                </div>
            </div>
        </div>

        <!-- 结算界面 -->
        <div id="end-screen" class="screen overlay hidden">
            <div class="menu-box result-box">
                <div class="grade-badge" id="grade-display">S</div>
                <h2>STAGE CLEAR</h2>
                <div class="result-stats">
                    <div class="stat-row"><span>SCORE</span><span id="final-score-value">0</span></div>
                    <div class="stat-row"><span>BEST SCORE</span><span id="best-score">0</span></div>
                    <div class="stat-grid">
                        <div class="stat-item perfect">PERFECT: <span id="stat-perfect">0</span></div>
                        <div class="stat-item great">GREAT: <span id="stat-great">0</span></div>
                        <div class="stat-item good">GOOD: <span id="stat-good">0</span></div>
                        <div class="stat-item miss">MISS: <span id="stat-miss">0</span></div>
                    </div>
                    <div class="stat-row"><span>MAX COMBO</span><span id="stat-maxcombo">0</span></div>
                    <div class="stat-row"><span>ACCURACY</span><span id="stat-accuracy">0%</span></div>
                </div>
                <div class="menu-buttons">
                    <button id="retry-btn" class="cyber-btn">PLAY AGAIN</button>
                    <button id="result-home-btn" class="cyber-btn secondary">CHOOSE SONG</button>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>

</html>
